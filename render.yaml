# render.yaml — Render Blueprint (https://render.com/docs/blueprint-spec)
# In Render: New → Blueprint → pick this repo. Render reads this file and asks for
# the values marked `sync: false`.

services:
  - type: web
    name: cipam-ipr-translator
    runtime: docker
    plan: free
    region: singapore          # same region as the Neon database (aws-ap-southeast-1)
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true    # Render generates a random secret
      - key: DATABASE_URL      # Neon POOLED connection string (host contains "-pooler")
        sync: false
      - key: DIRECT_URL        # Neon DIRECT connection string (no "-pooler"), for migrations
        sync: false
      - key: GEMINI_API_KEY
        sync: false
